<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kaleidoscope Burst</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #000;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    background: #000;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<audio id="music" src="music.mp3" loop autoplay preload="auto"></audio>

<script>
(function() {
  const audio = document.getElementById('music');
  audio.loop = true;
  audio.volume = 1;

  const events = ['pointerdown', 'pointerup', 'touchstart', 'touchend', 'click', 'keydown', 'wheel'];
  function unlock() {
    audio.muted = false;
    audio.play().then(() => {
      events.forEach(e => window.removeEventListener(e, unlock, true));
    }).catch(() => {});
  }

  // 1) Try normal autoplay with sound (works if the browser/site allows it).
  audio.muted = false;
  audio.play().catch(() => {
    // 2) Blocked: start silently so playback is already running...
    audio.muted = true;
    audio.play().catch(() => {});
    // 3) ...and turn the sound on at the very first input of any kind.
    events.forEach(e => window.addEventListener(e, unlock, true));
  });

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && audio.paused) audio.play().catch(() => {});
  });
})();
</script>
<script>
(function() {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');

  let W, H, DPR, cx, cy, R;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    cx = W / 2;
    cy = H / 2;
    R = Math.hypot(W, H) / 2 + 40;
  }
  window.addEventListener('resize', resize);
  resize();

  // Continuous random hue picking (instead of a fixed palette) means colors
  // never truly repeat in the same combinations, while staying vivid on black.
  function randomColor() {
    const hue = Math.random() * 360;
    const sat = 75 + Math.random() * 20;
    const light = 52 + Math.random() * 18;
    return `hsl(${hue.toFixed(1)}, ${sat.toFixed(0)}%, ${light.toFixed(0)}%)`;
  }

  const segments = 8;

  // ---------- Swooping streaks (curved lines) ----------
  class Swoop {
    constructor() { this.reset(true); }
    reset(initial) {
      // travel either outward (center -> edge) or inward (edge -> center), and start
      // from anywhere in the radial range so motion reads as coming from all directions
      const outward = Math.random() < 0.55;
      const near = Math.random() * 0.35;
      const far = 0.7 + Math.random() * 0.7;
      this.r0 = outward ? near : far;
      this.r1 = outward ? far : near;
      this.a0 = Math.random() * Math.PI * 2;
      this.a1 = this.a0 + (Math.random() - 0.5) * 3.0;
      this.rc = (this.r0 + this.r1) / 2 + (Math.random() - 0.5) * 0.4;
      this.ac = (this.a0 + this.a1) / 2 + (Math.random() - 0.5) * 1.8;
      this.color = randomColor();
      this.width = 1 + Math.random() * 3.6;
      this.trailLen = 0.1 + Math.random() * 0.28;
      this.speed = 0.1 + Math.random() * 0.34;
      this.progress = initial ? Math.random() * -0.6 : -0.15 - Math.random() * 0.5;
      this.glow = 6 + Math.random() * 18;
      this.spin = (Math.random() - 0.5) * 0.12;
    }
    polarPoint(r, a) { return [Math.cos(a) * r * R, Math.sin(a) * r * R]; }
    pointAt(u, timeOffset) {
      const mt = 1 - u;
      const r = mt * mt * this.r0 + 2 * mt * u * this.rc + u * u * this.r1;
      const a = mt * mt * this.a0 + 2 * mt * u * this.ac + u * u * this.a1 + timeOffset;
      return this.polarPoint(r, a);
    }
    update(dt) {
      this.progress += this.speed * dt;
      if (this.progress - this.trailLen > 1.2) this.reset(false);
    }
    draw(ctx, timeOffset) {
      const head = this.progress, tail = this.progress - this.trailLen, steps = 5;
      ctx.lineCap = 'round';
      ctx.strokeStyle = this.color;
      for (let i = 0; i < steps; i++) {
        const u0 = tail + (head - tail) * (i / steps);
        const u1 = tail + (head - tail) * ((i + 1) / steps);
        if (u1 < 0 || u0 > 1) continue;
        const cu0 = Math.max(0, Math.min(1, u0)), cu1 = Math.max(0, Math.min(1, u1));
        const localT = i / steps;
        const alpha = Math.max(0, Math.sin(Math.PI * localT));
        const [x0, y0] = this.pointAt(cu0, timeOffset);
        const [x1, y1] = this.pointAt(cu1, timeOffset);
        // cheap glow: a wide faint pass plus a thin bright core, no shadowBlur
        ctx.globalAlpha = alpha * 0.28;
        ctx.lineWidth = this.width * 2.6;
        ctx.beginPath();
        ctx.moveTo(x0, y0);
        ctx.lineTo(x1, y1);
        ctx.stroke();
        ctx.globalAlpha = alpha * 0.9;
        ctx.lineWidth = this.width;
        ctx.beginPath();
        ctx.moveTo(x0, y0);
        ctx.lineTo(x1, y1);
        ctx.stroke();
      }
    }
  }

  // ---------- Drifting geometric shapes (triangles, diamonds, rings, sparks) ----------
  class Shape {
    constructor() { this.reset(true); }
    reset(initial) {
      this.type = Math.floor(Math.random() * 6); // 0 diamond 1 triangle 2 ring 3 spark 4 hexagon 5 star
      const outward = Math.random() < 0.5;
      const near = Math.random() * 0.25;
      const far = 0.55 + Math.random() * 0.75;
      this.r0 = outward ? near : far;
      this.r1 = outward ? far : near;
      this.a = Math.random() * Math.PI * 2;
      this.aSpeed = (Math.random() - 0.5) * 0.7;
      this.size0 = 0.008 + Math.random() * 0.018;
      this.size1 = this.size0 + 0.02 + Math.random() * 0.07;
      this.rot = Math.random() * Math.PI * 2;
      this.rotSpeed = (Math.random() - 0.5) * 3.2;
      this.color = randomColor();
      this.speed = 0.12 + Math.random() * 0.4;
      this.progress = initial ? Math.random() : -Math.random() * 0.4;
      this.life = 1;
    }
    update(dt) {
      this.progress += this.speed * dt;
      this.a += this.aSpeed * dt;
      this.rot += this.rotSpeed * dt;
      if (this.progress > 1.3) this.reset(false);
    }
    draw(ctx, t) {
      const u = Math.max(0, Math.min(1, this.progress));
      const r = (this.r0 + (this.r1 - this.r0) * u) * R;
      const size = (this.size0 + (this.size1 - this.size0) * u) * R;
      const x = Math.cos(this.a) * r;
      const y = Math.sin(this.a) * r;
      // fade in then out across full lifespan
      const fade = Math.sin(Math.PI * Math.max(0, Math.min(1, this.progress / 1.1)));
      const alpha = Math.max(0, fade) * 0.9;

      // manual rotation math instead of ctx.save/translate/rotate/restore —
      // far cheaper when called thousands of times per frame
      const cosR = Math.cos(this.rot), sinR = Math.sin(this.rot);
      const P = (px, py) => [x + px * cosR - py * sinR, y + px * sinR + py * cosR];

      ctx.globalAlpha = alpha;
      ctx.strokeStyle = this.color;
      ctx.fillStyle = this.color;
      ctx.lineWidth = Math.max(1, size * 0.15);

      if (this.type === 0) {
        const p0 = P(0, -size), p1 = P(size * 0.6, 0), p2 = P(0, size), p3 = P(-size * 0.6, 0);
        ctx.beginPath();
        ctx.moveTo(p0[0], p0[1]); ctx.lineTo(p1[0], p1[1]);
        ctx.lineTo(p2[0], p2[1]); ctx.lineTo(p3[0], p3[1]);
        ctx.closePath(); ctx.fill();
      } else if (this.type === 1) {
        const p0 = P(0, -size), p1 = P(size * 0.87, size * 0.5), p2 = P(-size * 0.87, size * 0.5);
        ctx.beginPath();
        ctx.moveTo(p0[0], p0[1]); ctx.lineTo(p1[0], p1[1]);
        ctx.lineTo(p2[0], p2[1]); ctx.closePath();
        ctx.fill();
      } else if (this.type === 2) {
        ctx.beginPath();
        ctx.arc(x, y, size, 0, Math.PI * 2);
        ctx.stroke();
      } else if (this.type === 3) {
        const a0 = P(-size, 0), a1 = P(size, 0), b0 = P(0, -size), b1 = P(0, size);
        ctx.beginPath();
        ctx.moveTo(a0[0], a0[1]); ctx.lineTo(a1[0], a1[1]);
        ctx.moveTo(b0[0], b0[1]); ctx.lineTo(b1[0], b1[1]);
        ctx.stroke();
      } else if (this.type === 4) {
        ctx.beginPath();
        for (let k = 0; k < 6; k++) {
          const ang = (Math.PI / 3) * k - Math.PI / 2;
          const p = P(Math.cos(ang) * size, Math.sin(ang) * size);
          if (k === 0) ctx.moveTo(p[0], p[1]); else ctx.lineTo(p[0], p[1]);
        }
        ctx.closePath();
        ctx.stroke();
      } else {
        ctx.beginPath();
        for (let k = 0; k < 10; k++) {
          const ang = (Math.PI / 5) * k - Math.PI / 2;
          const rad = k % 2 === 0 ? size : size * 0.42;
          const p = P(Math.cos(ang) * rad, Math.sin(ang) * rad);
          if (k === 0) ctx.moveTo(p[0], p[1]); else ctx.lineTo(p[0], p[1]);
        }
        ctx.closePath();
        ctx.fill();
      }
    }
  }

  let swoops = [], shapes = [];
  const NUM_SWOOPS = 10;
  const NUM_SHAPES = 18;

  function initAll() {
    swoops = []; shapes = [];
    for (let i = 0; i < NUM_SWOOPS; i++) swoops.push(new Swoop());
    for (let i = 0; i < NUM_SHAPES; i++) shapes.push(new Shape());
  }
  initAll();

  let lastTime = performance.now();
  let t0 = performance.now();
  let pausedAt = 0;

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      pausedAt = performance.now();
    } else {
      // shift all time-based anchors forward by however long we were hidden,
      // so nothing "catches up" in one huge stuttering jump
      const gap = performance.now() - pausedAt;
      lastTime += gap;
      t0 += gap;
    }
  });

  function draw(now) {
    const dt = Math.min(0.033, (now - lastTime) / 1000);
    lastTime = now;
    const t = (now - t0) / 1000;

    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = 'rgba(0,0,0,0.15)';
    ctx.fillRect(0, 0, W, H);

    ctx.globalCompositeOperation = 'lighter';

    const globalRotation = t * 0.04;
    const segAngle = (Math.PI * 2) / segments;

    swoops.forEach(s => s.update(dt));
    shapes.forEach(s => s.update(dt));

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(globalRotation);

    for (let s = 0; s < segments; s++) {
      ctx.save();
      ctx.rotate(segAngle * s);
      if (s % 2 === 1) ctx.scale(1, -1);

      swoops.forEach(sw => sw.draw(ctx, sw.spin * t));
      shapes.forEach(sh => sh.draw(ctx, t));

      ctx.restore();
    }
    ctx.restore();

    ctx.globalCompositeOperation = 'source-over';
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
